<!doctype html>
<!-- dev/index.html mirrors this skeleton so that mop.css can be previewed
     without the daemon. Any change to the elements or ids below belongs
     there too, or the preview stops matching the real page. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/static/mop.css" />
  </head>
  <body data-doc-id="{{.ID}}">
    <header id="mop-title">{{.Title}}</header>
    <main id="mop-content"></main>
    <!-- The raw Markdown is embedded so the first render does not have to
         wait for the SSE connection. Nothing is rendered without JS; this is
         a local only tool, so that is accepted. -->
    <script id="mop-initial" type="application/json">
      {{.Initial}}
    </script>
    <div id="mop-status" hidden></div>
    <script type="module" src="/static/mop.js"></script>
  </body>
</html>
